name: Deploy Estonia FIRE Planner to GitHub Pages

# Publish only when a GitHub release is published, or when run manually from
# the Actions tab. A failed build or test prevents deployment.
on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install site builder dependency
        run: python -m pip install Markdown==3.5.2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Build and test
        run: bash test/run.sh

      # Publish only browser-facing artifacts. Source documents, tests,
      # repository metadata and ignored private files never enter the Pages
      # artifact.
      - name: Assemble site
        run: |
          mkdir -p _site/src
          cp index.html simulator.html pension.html tokens.css styles.css _site/
          cp -r guide _site/
          cp src/nav.js _site/src/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
